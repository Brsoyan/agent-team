name: Bug report
description: Something the agents do, the board shows, or the orchestrator runs is broken.
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. Bugs with reproducible steps get fixed; bugs without don't. Please be specific.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Paste board screenshots, agent log tails, or terminal output where helpful.
      placeholder: "When the developer agent finishes, the gatekeeper times out instead of running tsc..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: From a clean clone — what do you click, what do you type? Include the project's PRD if it matters.
      value: |
        1. `npm install && cd board && npm install && cd .. && npm run dev`
        2. New project named "X" with PRD: …
        3. Click "Run Day"
        4. …
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Which agent (if any) is involved?
      options:
        - "manager"
        - "pm"
        - "critic"
        - "designer"
        - "developer"
        - "gatekeeper (quality gate)"
        - "reviewer"
        - "qa"
        - "not agent-specific (board, API, orchestrator)"

  - type: input
    id: env
    attributes:
      label: Environment
      description: "Node version, OS, Claude Code CLI version (`claude --version`)"
      placeholder: "Node 20.18, macOS 14.4, claude-code 1.0.x"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Tail of `data/projects/<id>/logs/<role>.log`, board console errors, or API server output. Paste in a code block."
      render: shell
